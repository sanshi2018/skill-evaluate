services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: skill_evaluate
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: skill_evaluate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skill_evaluate"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
