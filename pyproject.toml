[project]
name = "skill-evaluate"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3",
    # LLM 出口统一走 OpenRouter（OpenAI 兼容协议），由 ChatOpenAI 承载。
    "langchain-openai>=1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "structlog>=24.4",
    "tenacity>=9.0",
    "typer>=0.13",
    "alembic>=1.13",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "pytest>=9.1.1",
]

[project.optional-dependencies]
langfuse = ["langfuse>=2.50"]
# docs/dev/12：模块二用 Token 数做硬性卡线。装了 tiktoken 就走离线精确计数，
# 没装则退化为字符比例估算并**如实标注不精确**（此时限额附近不阻断，改为请人
# 确认）。做成可选依赖而不是必需：只跑其余维度的环境不该被迫拉一份 BPE 词表。
tokenizer = ["tiktoken>=0.8"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "testcontainers[postgres]>=4.8",
]

[project.scripts]
skill-evaluate = "skill_evaluate.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_evaluate"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

# `langchain_openai` 只在装了运行期依赖的环境里存在；只跑静态检查的环境（如只装
# dev 组的 CI 作业）不应因此报 import-not-found。用 overrides 而不是在代码里写
# `# type: ignore`，避免在真正装了包的环境里反过来触发 unused-ignore。
[[tool.mypy.overrides]]
module = "langchain_openai.*"
ignore_missing_imports = true

# PyYAML 是**可选**依赖：`agents/validator/toolbox.py` 装了就用、没装就退化为内置
# 的极简 manifest 解析器（docs/dev/10 第 3.1 节）。不写这条 override 的话，装了
# PyYAML 但没装 types-PyYAML 的环境会因为缺 stub 而报错。
[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
# 项目的 state 契约里存在名为 TestCase/TestCaseCategory 的 Pydantic 模型/枚举
# （docs/dev/02），与 pytest 默认的 "Test*" 类收集规则撞名，收窄收集规则避免
# 误报 PytestCollectionWarning。
python_classes = "*Tests"
