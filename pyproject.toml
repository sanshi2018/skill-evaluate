[project]
name = "skill-evaluate"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "structlog>=24.4",
    "tenacity>=9.0",
    "typer>=0.13",
    "alembic>=1.13",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
]

[project.optional-dependencies]
langfuse = ["langfuse>=2.50"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "testcontainers[postgres]>=4.8",
]

[project.scripts]
skill-evaluate = "skill_evaluate.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_evaluate"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
# 项目的 state 契约里存在名为 TestCase/TestCaseCategory 的 Pydantic 模型/枚举
# （docs/dev/02），与 pytest 默认的 "Test*" 类收集规则撞名，收窄收集规则避免
# 误报 PytestCollectionWarning。
python_classes = "*Tests"
